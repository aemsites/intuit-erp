:root{--bg:#0D0031;--stage-w:900px;--stage-h:634px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font:13px/1.4 system-ui,-apple-system,sans-serif}
body{display:grid;grid-template-rows:1fr auto;place-items:center}
#stagewrap{width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
#fit{position:relative}
#stage{position:absolute;left:0;top:0;width:var(--stage-w);height:var(--stage-h);overflow:hidden;background:var(--bg);transform-origin:0 0;cursor:pointer}
.pos{position:absolute;left:75px;top:171px;width:628px;height:416px;will-change:transform}
.fade{width:100%;height:100%;will-change:opacity,filter}
.card{width:100%;height:100%;border-radius:20px;overflow:hidden;background:#fff}
.card svg{display:block}
.d400,.d500{font-family:'Tally Display',Inter,'Avenir Next','Helvetica Neue',Arial,sans-serif}
.t400,.t500{font-family:'Tally','Intuit Sans',Inter,'Avenir Next','Helvetica Neue',Arial,sans-serif}
.d400,.t400{font-weight:400}.d500,.t500{font-weight:500}
svg text{white-space:pre;font-kerning:normal;letter-spacing:0;text-rendering:geometricPrecision}
#chrome{width:min(900px,100%);display:flex;gap:10px;align-items:center;padding:8px 12px;font-variant-numeric:tabular-nums}
#chrome.hide{display:none}
#scrub{flex:1;accent-color:#5CA9FC}
#time{min-width:15ch;opacity:.7}
button{background:#26263b;color:#eee;border:1px solid #3a3a5a;border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit}
</style>

  const pos=(from,to,p)=>RM?(tau<450?S[from]:S[to]):[lerp(S[from][0],S[to][0],p),lerp(S[from][1],S[to][1],p)];
  if(role===1){ const p=pf(tau), q=pos(1,0,p), pa=sstep((tau-P.aT0)/(P.aT1-P.aT0));
    return {x:q[0],y:q[1],a:.30+.70*pa,b:P.inBlur*(1-pa),z:tau<700?30:40}; }
  if(role===2){ const p=pf(tau-P.stag), q=pos(2,1,p); return {x:q[0],y:q[1],a:.30,b:0,z:tau<700?20:30}; }
  if(role===3){ const p=pf(tau-2*P.stag), pc=clamp(p), q=pos(3,2,p); return {x:q[0],y:q[1],a:.10+.20*pc,b:0,z:tau<700?10:20}; }
  // role 0: the front card exits, then re-enters at the back
  if(tau<P.exitDur){
    const d=RM?0:P.exitD*Math.pow(tau/P.exitDur,2), f=clamp((tau-P.fadeS)/(P.fadeE-P.fadeS));
    return {x:-d,y:d,a:1-sstep(f),b:P.blurMax*Math.pow(f,P.blurExp),z:50};
  }
  if(tau<P.arrS) return {x:S[4][0],y:S[4][1],a:0,b:0,z:5};
  const q=outCubic((tau-P.arrS)/(P.arrE-P.arrS));
  const x=RM?S[3][0]:lerp(S[4][0],S[3][0],q), y=RM?S[3][1]:lerp(S[4][1],S[3][1],q);
  return {x,y,a:.10*(RM?sstep((tau-P.arrS)/(P.arrE-P.arrS)):q),b:0,z:5};
}

/* One animation per property per element: dense 60fps keyframes sampled from the measured model. */
function buildCards(){
  const N=Math.ceil(DURATION/(1000/FPS))+1;
  for(let c=0;c<4;c++){
    const pos=document.getElementById('pos'+c), fade=document.getElementById('fade'+c);
    const kp=[],ko=[],kb=[],kz=[];
    for(let i=0;i<N;i++){
      const t=Math.min(DURATION,i*1000/FPS), off=t/DURATION, s=state(c,t);
      kp.push({offset:off,transform:`translate(${s.x.toFixed(2)}px,${s.y.toFixed(2)}px)`});
      ko.push({offset:off,opacity:+s.a.toFixed(4)});
      kb.push({offset:off,filter:`blur(${s.b.toFixed(2)}px)`});
      kz.push({offset:off,zIndex:s.z,easing:'steps(1,end)'});
    }
    anim(pos,kp,{duration:DURATION,card:1}); anim(fade,ko,{duration:DURATION,card:1});
    anim(fade.firstElementChild,kb,{duration:DURATION,card:1});   // blur on the card, opacity on its wrapper
    anim(pos,kz,{duration:DURATION,card:1});
  }
}

window.rebuildCards=()=>{ CARD_TL.splice(0).forEach(a=>{a.cancel(); const i=TL.indexOf(a); if(i>=0)TL.splice(i,1);}); buildCards(); window.seek(clock); };
window.P=P; window.T=T; window.RINGS=RINGS;
window.rebuildRings=()=>{ RING_TL.splice(0).forEach(a=>{a.cancel(); const i=TL.indexOf(a); if(i>=0)TL.splice(i,1);}); RINGS.forEach(buildRing); window.seek(clock); };
window.rebuildCharts=()=>{ CH_TL.splice(0).forEach(a=>{a.cancel(); const i=TL.indexOf(a); if(i>=0)TL.splice(i,1);}); buildCharts(); window.seek(clock); };

/* AI-widget stroke: N short overlapping dashes along the true perimeter. Every dash runs the SAME colour cycle,
   time-shifted by its position, so the gradient flows clockwise at constant linear speed and loops seamlessly
   (whole number of revolutions per loop). */
function gradAt(u){ u=((u%1)+1)%1; const n=GRAD.length;
  for(let i=0;i<n;i++){ const a=GRAD[i], b=GRAD[(i+1)%n]; const pa=a.p, pb=b.p+(i===n-1?1:0), v=(u<pa&&i===n-1)?u+1:u;
    if(v>=pa&&v<=pb){ const k=(v-pa)/(pb-pa); return a.c.map((c,j)=>Math.round(c+(b.c[j]-c)*k)); } }
  return GRAD[0].c; }
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function buildRing(R){
  const g=document.getElementById(R.g); g.innerHTML=''; const NS='http://www.w3.org/2000/svg', sw=STROKE_W, ins=sw/2, rr=R.r-ins;
  const w=R.w-sw, h=R.h-sw, L=2*(w-2*rr)+2*(h-2*rr)+2*Math.PI*rr;       // exact centre-line length
  const N=Math.ceil(L/8), seg=1000/N, ov=.8/L*1000;                    // ~8px dashes, 0.8px overlap hides seams
  const revs=Math.max(1,Math.round(RING_SPEED*DURATION/1000/L)), T=DURATION/revs;
  const K=[]; const M=72; for(let j=0;j<=M;j++) K.push({offset:j/M,stroke:rgb(gradAt(-j/M))});
  for(let i=0;i<N;i++){
    const u=(i+.5)/N, e=document.createElementNS(NS,'rect');
    e.setAttribute('x',R.x+ins);e.setAttribute('y',R.y+ins);e.setAttribute('width',w);e.setAttribute('height',h);e.setAttribute('rx',rr);
    e.setAttribute('pathLength',1000);e.setAttribute('fill','none');e.setAttribute('stroke-width',sw);
    e.setAttribute('stroke-dasharray',`${seg+ov} ${1000-seg-ov}`);e.style.strokeDashoffset=-(i*seg);
    e.setAttribute('stroke',rgb(gradAt(u-R.ph)));g.appendChild(e);
    if(!RM){ const q=(((R.ph-u)%1)+1)%1;                                 // colour cycle shifted by this dash's position
      const a=e.animate(K,{duration:T,iterations:revs+1,delay:-q*T,easing:'linear',fill:'both'});
      a.pause(); a.currentTime=clock; TL.push(a); RING_TL.push(a); }
  }
}

/* Chart draws (absolute video ms). */
function drawPath(id,pts,prop='strokeDashoffset'){
  const f=pchip(pts), t0=pts[0][0], t1=pts[pts.length-1][0], el=document.getElementById(id);
  if(RM){ el.style.strokeDashoffset=0; return; }
  const kf=[]; const n=Math.ceil((t1-t0)/(1000/FPS));
  for(let i=0;i<=n;i++){ const t=Math.min(t1,t0+i*1000/FPS); kf.push({offset:i/n,strokeDashoffset:+(1-f(t)).toFixed(4)}); }
  anim(el,kf,{at:t0+CH.shift[CH.cur],duration:t1-t0,chart:1});
}
function reveal(id,at,dur=120){ const el=document.getElementById(id); if(RM){el.style.opacity=.7;return;} anim(el,[{opacity:0},{opacity:.7}],{at:at+CH.shift[CH.cur],duration:dur,easing:'ease-out',chart:1}); }
const CH={shift:{fs:-25,pl:-40},cur:'fs'}; window.CH=CH;
function buildCharts(){ CH.cur='fs';
  const blue=[[650,0],[760,.307],[880,.662],[1000,1]];
  const brown=[[800,0],[950,.188],[1100,.399],[1250,.601],[1450,.8],[1700,1]];
  drawPath('fsBlue',blue); drawPath('fsBrown',brown);
  drawPath('fsDmask',[[1450,0],[1750,1]]);
  brown.forEach((p,i)=>reveal('fsV'+i,p[0]));
  CH.cur='pl';
  const pl=[[3380,0],[3520,.229],[3650,.421],[3780,.617],[3910,.81],[4040,1]];
  drawPath('plLine',pl); pl.forEach((p,i)=>reveal('plV'+i,p[0]));
  const dot=document.getElementById('plDot');
  if(RM) dot.style.transform='scale(1)';
  else anim(dot,[{transform:'scale(0)'},{transform:'scale(1.35)',offset:.6},{transform:'scale(1)'}],{at:4040+CH.shift.pl,duration:180,easing:'ease-out',chart:1});
}

/* =====================================================================
   3. Chrome, fit-to-viewport, play loop
   ===================================================================== */
const scrub=document.getElementById('scrub'), timeEl=document.getElementById('time'), chromeEl=document.getElementById('chrome');
function syncChrome(){ scrub.value=clock; timeEl.textContent=`${Math.round(clock)} ms · f${(clock/1000*FPS).toFixed(1)}`; }
let playing=!RM || true, base=0, t0=performance.now(), raf=null;
function loop(now){ if(playing){ window.seek((now-t0+base)%DURATION); } raf=requestAnimationFrame(loop); }
function setPlaying(p){ if(p===playing)return;  playing=p;
  if(p){ base=clock; t0=performance.now(); } }
function fit(){ const stage=document.getElementById('stage'), fitEl=document.getElementById('fit');
  const w=innerWidth, h=innerHeight-(chromeEl.classList.contains('hide')?0:chromeEl.offsetHeight);
  const s=Math.min(w/900,h/634); fitEl.style.width=900*s+'px'; fitEl.style.height=634*s+'px'; stage.style.transform=`scale(${s})`; }
function init(){
  if(new URLSearchParams(location.search).get('chrome')==='0'){ chromeEl.classList.add('hide'); }
  scrub.max=DURATION;
  scrub.addEventListener('input',e=>{ setPlaying(false); window.seek(+e.target.value); });
  document.getElementById('stage').addEventListener('click',()=>setPlaying(!playing));
  addEventListener('keydown',e=>{ if(e.key===' '){e.preventDefault();setPlaying(!playing);}
    const fr=1000/FPS; if(e.key==='ArrowRight'){setPlaying(false);window.seek(clock+(e.shiftKey?fr*10:fr));}
    if(e.key==='ArrowLeft'){setPlaying(false);window.seek(clock-(e.shiftKey?fr*10:fr));} });
  addEventListener('resize',fit); fit();
  RINGS.forEach(buildRing); buildCards(); buildCharts();
  const m=/t=(\d+)/.exec(location.hash); window.seek(m?+m[1]:0);
  if(m||new URLSearchParams(location.search).get('paused')==='1') setPlaying(false);
  raf=requestAnimationFrame(loop);
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(init);
