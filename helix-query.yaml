version: 1
indices:
  case-studies:
    include:
      - /blog/case-study/*
    target: /blog/case-study/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[property="og:description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="date"]
        value: attribute(el, "content")
      industry:
        select: head > meta[name="industry"]
        value: attribute(el, "content")
  research:
    include:
      - /blog/research/*
    target: /blog/research/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[property="og:description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="date"]
        value: attribute(el, "content")
  blog:
    include:
      - /blog/**
    exclude:
      - /blog/case-study/**
      - /blog/research/**
      - /blog/guide/**
      - /blog/author/**
      - /blog/category/**
      - /blog/
    target: /blog/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[property="og:description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="date"]
        value: attribute(el, "content")
      lastUpdated:
        select: head > meta[name="updated"]
        value: attribute(el, "content")
      author:
        select: head > meta[name="author"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      tags:
        select: head > meta[name="tags"]
        value: attribute(el, "content")
      template:
        select: head > meta[name="template"]
        value: attribute(el, "content")
  guides:
    include:
      - /blog/guide/*
    target: /blog/guide/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      description:
        select: head > meta[property="og:description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="date"]
        value: attribute(el, "content")
      lastUpdated:
        select: head > meta[name="updated"]
        value: attribute(el, "content")
      author:
        select: head > meta[name="author"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      tags:
        select: head > meta[name="tags"]
        value: attribute(el, "content")
  events:
    include:
      - /events/*
    target: /events/query-index.json
    properties:
      title:
        select: div > div > div:has(#title-1) > div:last-child
        value: textContent(el)
      type:
        select: div > div > div:has(#type) > div:last-child
        value: textContent(el)
      description:
        select: div > div > div:has(#description) > div:last-child
        value: textContent(el)
      date:
        select: div > div > div:has(#date) > div:last-child
        value: textContent(el)
      time:
        select: div > div > div:has(#time) > div:last-child
        value: textContent(el)
      location:
        select: div > div > div:has(#location) > div:last-child
        value: textContent(el)
      speakers:
        select: div > div > div:has(#speakers) > div:last-child
        value: textContent(el)
      image:
        select: div > div > div:has(#image) > div:last-child
        value: textContent(el)
      ctaLabel:
        select: div > div > div:has(#ctalabel) > div:last-child
        value: textContent(el)
      ctaUrl:
        select: div > div > div:has(#ctaurl) > div:last-child
        value: textContent(el)
      status:
        select: div > div > div:has(#status) > div:last-child
        value: textContent(el)
