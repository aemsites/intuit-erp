<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>404 - Page Not Found | Intuit Enterprise Suite</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
    // Trailing-slash recovery: EDS serves /page and /page/ as different
    // resources and does not redirect between them, so /page/ 404s. When this
    // error page loads for a path with a trailing slash, redirect to the
    // canonical slash-free path (preserving query + hash) before anything
    // paints. replace() keeps the bad URL out of history.
    (function redirectTrailingSlash() {
      const { pathname, search, hash } = window.location;
      if (pathname.length > 1 && pathname.endsWith('/')) {
        window.location.replace(pathname.replace(/\/+$/, '') + search + hash);
      }
    }());
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The page you're looking for cannot be found">
  <meta property="og:title" content="404 - Page Not Found | Intuit Enterprise Suite">
  <meta property="og:description" content="The page you're looking for cannot be found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      padding: 48px 20px;
    }

    main.error .section {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }

    main.error .error-sr-heading {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    main.error .error-headline {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-color);
      margin: 0 0 16px;
    }

    main.error .error-subhead {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-color);
      margin: 0;
    }

    main.error .button-wrapper {
      display: inline-block;
      margin: 40px 8px 0;
    }

    main.error .button-wrapper .button {
      min-width: 200px;
      border-radius: 4px;
    }

    main.error .button.secondary {
      background-color: #d4d7dc;
      border-color: #d4d7dc;
    }

    main.error .error-go-back {
      color: var(--link-color);
      text-decoration: underline;
    }

    main.error .error-learn-more {
      font-style: italic;
      font-size: 16px;
      line-height: 1.5;
      margin: 40px 0 0;
    }

    main.error .error-learn-more a {
      font-style: italic;
      font-size: 20px;
      line-height: 1.4;
    }

    main.error .error-promo-list {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin: 24px 0 0;
      padding: 0;
      text-align: left;
    }

    main.error .error-promo-list li {
      background-color: #f7f7f7;
      border-radius: 4px;
    }

    main.error .error-promo-list a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      color: var(--link-color);
      text-decoration: none;
    }

    main.error .error-promo-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    main.error .error-promo-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (min-width: 900px) {
      main.error .error-promo-list {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error"></main>
  <footer></footer>
</body>

</html>
