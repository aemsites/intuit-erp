<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>404 - Page Not Found | Intuit Enterprise Suite</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
    // Trailing-slash recovery: EDS serves /page and /page/ as different
    // resources and does not redirect between them, so /page/ 404s. When this
    // error page loads for a path with a trailing slash, redirect to the
    // canonical slash-free path (preserving query + hash) before anything
    // paints. replace() keeps the bad URL out of history.
    (function redirectTrailingSlash() {
      const { pathname, search, hash } = window.location;
      if (pathname.length > 1 && pathname.endsWith('/')) {
        window.location.replace(pathname.replace(/\/+$/, '') + search + hash);
      }
    }());
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The page you're looking for cannot be found">
  <meta property="og:title" content="404 - Page Not Found | Intuit Enterprise Suite">
  <meta property="og:description" content="The page you're looking for cannot be found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('error-go-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.error-button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <script nonce="aem" type="module">
    import {
      LOGO_TURBOTAX_ICON,
      LOGO_CREDITKARMA_ICON,
      LOGO_QUICKBOOKS_ICON,
      LOGO_MAILCHIMP_ICON,
    } from '/blocks/header/brand-logos.js';

    const icons = {
      turbotax: LOGO_TURBOTAX_ICON,
      creditkarma: LOGO_CREDITKARMA_ICON,
      quickbooks: LOGO_QUICKBOOKS_ICON,
      mailchimp: LOGO_MAILCHIMP_ICON,
    };

    document.querySelectorAll('.error-promo-icon[data-icon]').forEach((el) => {
      el.innerHTML = icons[el.dataset.icon] || '';
    });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      padding: 48px 20px;
    }

    main.error .error-content {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      text-align: center;
    }

    main.error .error-sr-heading {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    main.error .error-headline {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-color);
      margin: 0 0 16px;
    }

    main.error .error-subhead {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-color);
      margin: 0;
    }

    main.error .error-button-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin: 40px 0 0;
    }

    main.error .error-button-container a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 200px;
      padding: 14px 28px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25;
      text-decoration: none;
    }

    main.error .error-button-home {
      background-color: var(--primary);
      color: #fff;
    }

    main.error .error-button-contact {
      background-color: #d4d7dc;
      color: var(--text-color);
    }

    main.error .error-go-back {
      background-color: transparent;
      color: var(--link-color);
      text-decoration: underline;
      min-width: 0;
    }

    main.error .error-learn-more {
      font-style: italic;
      font-size: 16px;
      line-height: 1.5;
      margin: 40px 0 0;
    }

    main.error .error-learn-more a {
      font-style: italic;
      font-size: 20px;
      line-height: 1.4;
    }

    main.error .error-promo-list {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin: 24px 0 0;
      padding: 0;
      text-align: left;
    }

    main.error .error-promo-list li {
      background-color: #f7f7f7;
      border-radius: 4px;
    }

    main.error .error-promo-list a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      color: var(--link-color);
      text-decoration: none;
    }

    main.error .error-promo-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    main.error .error-promo-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (min-width: 900px) {
      main.error .error-promo-list {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section error-content">
      <h1 class="error-sr-heading">404 - Page Not Found</h1>
      <p class="error-headline">We apologize for the inconvenience.</p>
      <p class="error-subhead">Sorry, but it turns out we can't find that page.</p>
      <p class="error-button-container">
        <a href="/" class="error-button-home">Back to Homepage</a>
        <a href="https://www.intuit.com/company/contact" class="error-button-contact">Contact Us</a>
      </p>
      <p class="error-learn-more">
        <a href="https://www.intuit.com/company/">Learn more about Intuit</a>
        or discover your path to prosperity by exploring our products.
      </p>
      <ul class="error-promo-list">
        <li>
          <a href="https://myturbotax.intuit.com/">
            <span class="error-promo-icon" data-icon="turbotax"></span>
            TurboTax
          </a>
        </li>
        <li>
          <a href="https://www.creditkarma.com/">
            <span class="error-promo-icon" data-icon="creditkarma"></span>
            Credit Karma
          </a>
        </li>
        <li>
          <a href="https://quickbooks.intuit.com/">
            <span class="error-promo-icon" data-icon="quickbooks"></span>
            QuickBooks
          </a>
        </li>
        <li>
          <a href="https://mailchimp.com/">
            <span class="error-promo-icon" data-icon="mailchimp"></span>
            Mailchimp
          </a>
        </li>
      </ul>
    </div>
  </main>
  <footer></footer>
</body>

</html>
